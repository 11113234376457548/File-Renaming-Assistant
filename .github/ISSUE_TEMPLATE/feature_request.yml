name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的场景
      description: 描述当前让你觉得不方便的地方。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选。你考虑过的其它做法。

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 可选。截图、参考链接等。
